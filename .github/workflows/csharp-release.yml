name: Build C# Windows release

on:
  push:
    tags:
      - 'csharp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build .NET Framework 4.8 executable
        run: dotnet build BrowserLauncher.CSharp/BrowserLauncher.CSharp.csproj --configuration Release --output artifacts -p:DebugType=None -p:DebugSymbols=false
      - name: Create GitHub Release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          name: C#版 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/BrowserLauncher.CSharp.exe
